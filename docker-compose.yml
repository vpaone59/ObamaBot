services:
  bot:
    build: .
    container_name: python3-obamabot
    env_file:
      - .env
    volumes:
      # Mount the logs folder to the host machine
      - ${HOST_LOG_PATH}:/logs
      # Mount the Minecraft server logs directory (read-only for monitoring)
      # Host path: /mnt/cache/appdata/minecraft-server-vanilla/logs (on Unraid)
      # Container path: /minecraft/logs
      # Adjust the host path based on your Unraid Minecraft container mount
      - /mnt/cache/appdata/minecraft-server-vanilla/logs:/minecraft/logs:ro
    restart: unless-stopped
